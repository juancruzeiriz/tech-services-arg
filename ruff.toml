target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: line too long (handled by formatter)
# B008: do not perform function calls in default arguments (some valid uses)
ignore = ["E501", "B008"]

[lint.per-file-ignores]
# S101: use of assert is fine in tests; E402: imports after sys.path manipulation
"tests/**" = ["S101", "E402"]
