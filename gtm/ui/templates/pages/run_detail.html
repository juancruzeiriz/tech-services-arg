{% extends "base.html" %}
{% block title %}Corrida {{ handle.ctx.run_id }}{% endblock %}
{% block content %}
{% include "fragments/run_detail_content.html" %}
{% endblock %}

{% block scripts %}
<script>
(function () {
  var status = "{{ handle.status }}";
  if (status === "ok" || status === "failed") return;

  var source = new EventSource("/runs/{{ handle.ctx.run_id }}/events");
  var counts = {};

  source.onmessage = function (evt) {
    var data = JSON.parse(evt.data);

    if (data.kind === "done" || data.kind === "error") {
      source.close();
      // htmx re-pide esta misma página y reemplaza solo #run-detail-content
      // -- a diferencia de location.reload(), no repinta el nav/sidebar ni
      // pierde la posición de scroll del usuario.
      htmx.ajax("GET", window.location.pathname, { target: "#run-detail-content", swap: "outerHTML" });
      return;
    }
    if (!data.stage) return;

    var countEl = document.querySelector('[data-stage-count="' + data.stage + '"]');
    if (data.kind === "item") {
      counts[data.stage] = (counts[data.stage] || 0) + 1;
      if (countEl) countEl.textContent = counts[data.stage] + (data.total ? " / " + data.total : "");
    } else if (data.kind === "stage_start") {
      if (countEl) countEl.textContent = "corriendo…";
    } else if (data.kind === "stage_end") {
      if (countEl) countEl.textContent = data.total + " listo";
      var row = document.getElementById("stage-row-" + data.stage);
      if (row) row.style.opacity = "0.55";
    }
  };
  source.onerror = function () { /* la conexión puede cortarse sola; recargar a mano si queda colgado */ };
})();
</script>
{% endblock %}
