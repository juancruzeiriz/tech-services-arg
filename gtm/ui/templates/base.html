<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel{% endblock %} · GTM</title>
<link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
<script src="{{ request.url_for('static', path='vendor/htmx.min.js') }}"></script>
<script src="{{ request.url_for('static', path='vendor/htmx-sse.js') }}"></script>
<script src="{{ request.url_for('static', path='vendor/alpine.min.js') }}" defer></script>
</head>
<body hx-ext="sse">
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">GTM<small>Fábrica de prospección</small></div>
    <nav>
      <a class="nav-link {{ 'active' if active == 'new_run' else '' }}" href="/">Nueva corrida</a>
      <a class="nav-link {{ 'active' if active == 'runs' else '' }}" href="/runs">Corridas</a>
      <a class="nav-link {{ 'active' if active == 'queue' else '' }}" href="/queue">Cola de contacto</a>
      <a class="nav-link {{ 'active' if active == 'funnel' else '' }}" href="/dashboard/funnel">Embudo</a>
      <a class="nav-link {{ 'active' if active == 'economics' else '' }}" href="/dashboard/economics">Economía</a>
      <a class="nav-link {{ 'active' if active == 'settings' else '' }}" href="/settings">Configuración</a>
      <a class="nav-link {{ 'active' if active == 'docs' else '' }}" href="/docs">Docs</a>
    </nav>
    <button class="theme-toggle mt-3" data-theme-toggle type="button">Tema: auto</button>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ request.url_for('static', path='app.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
