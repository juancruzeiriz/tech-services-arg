# Catálogo de metros. `rank` = población × (%hispano/100) ÷ (1.5 si hay riesgo legal
# mini-TCPA, si no 1.0), descendente = mejor primero — tamaño de pool esperado por la
# ventaja de vender en español, penalizado por el riesgo legal de tener que ceñirse a
# reglas de reintento más estrictas que el B2B federal.
#
# Cifras de población y %hispano son órdenes de magnitud de fuentes públicas
# (Census/ACS, vintage 2023-2025), no una medición propia — confirmar antes de
# tratarlas como algo más preciso que "aproximado" para decisiones legales.
#
# mini_tcpa_risk=true: el estado tiene su propia ley de telemarketing más estricta
# que la exención B2B federal (FL/FTSA, OK, MD, WA, NJ, GA, CT, TX 2025-2026). No
# descalifica el metro — el B2B a línea comercial sigue mayormente exento— pero pesa
# menos en el orden y merece revisar la ley del estado antes de la primera llamada.
#
# language_default: "es" si %hispano >= 45, si no "en". Es el default que precarga
# el formulario de la UI; el idioma real de la corrida siempre se puede cambiar.

- key: houston-tx
  city: "Houston"
  state: "TX"
  display: "Houston, TX"
  timezone: "America/Chicago"
  population: 2300000
  hispanic_pct: 45.0
  language_default: es
  mini_tcpa_risk: true
  rank: 1

