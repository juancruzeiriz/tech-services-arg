# Catálogo de oficios. `rank` = avg_ticket_usd × peso_de_urgencia (alto=3, medio=2,
# bajo=1), ascendente = mejor primero. Ver el docstring de `gtm/catalog/types.py`.
#
# Fuentes de avg_ticket_usd: HVAC y plumbing de una muestra de 760 negocios
# (Data-Driven Trades Newsletter, mar-2026, vía pipelineon.com); roofing de
# homeyou.com (rango USD 6.243-32.516, se usa un punto conservador dentro del
# rango, no la media, porque está sesgada por reemplazos completos); el resto son
# estimados de mercado a partir de guías de precio 2026 de HouseCallPro/ServiceTitan,
# marcados "estimado" — hay que confirmar con datos reales de Places+ventas antes de
# tratarlos como algo más que un orden de magnitud.
#
# name_prefixes/name_suffixes/sample_reviews_en alimentan `simulate.py`: son texto
# sintético para practicar el pipeline sin gastar cuota real, no datos de negocios
# reales. Neutros de región a propósito (no atados a Tucson) porque ahora el
# catálogo cubre 20 metros distintos.

